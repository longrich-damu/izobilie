<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#793acb">
  <meta name="description" content="Моё изобилие — личный дневник желаний на 45 игровых дней. Покупки, фотографии, послания и твоя история.">
  <title>Моё изобилие · Дневник желаний</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Перейти к дневнику</a>
  <div class="shell">
    <header class="site-header"><a class="brand" href="#today" aria-label="Моё изобилие, на главную"><span class="brand-mark" aria-hidden="true">✳</span><span>МОЁ ИЗОБИЛИЕ<small>Личный дневник желаний</small></span></a><span class="header-detail">45 дней для себя</span></header>
    <main id="main" tabindex="-1"><div class="loading" role="status">Открываю твой дневник…</div></main>
    <nav id="nav" class="nav" aria-label="Разделы дневника" hidden></nav>
    <footer class="site-footer">Мои желания. Мой выбор. Моё изобилие.</footer>
  </div>
  <dialog id="purchase-dialog" aria-labelledby="purchase-heading"><form id="purchase-form"><div class="dialog-heading"><h2 id="purchase-heading">Моя покупка</h2><button class="icon-button" type="button" data-close aria-label="Закрыть">×</button></div><p class="form-context" id="purchase-context"></p><label for="purchase-title">Что я купила</label><input id="purchase-title" name="title" maxlength="160" required autocomplete="off" placeholder="То самое пальто"><label for="purchase-price">Стоимость, ₸</label><input id="purchase-price" name="price" inputmode="decimal" required autocomplete="off" placeholder="5000"><p class="field-hint" id="price-hint"></p><label for="purchase-note">Несколько слов о покупке <span>по желанию</span></label><textarea id="purchase-note" name="note" rows="3" maxlength="4000" placeholder="Почему мне это нравится, как я буду этим пользоваться…"></textarea><label for="purchase-photo">Фотография <span>по желанию</span></label><label class="upload-zone" for="purchase-photo"><span class="upload-icon" aria-hidden="true">＋</span><strong id="photo-label">Выбрать фотографию</strong><small>С телефона или компьютера · до 20 МБ</small></label><input class="file-input" id="purchase-photo" name="photo" type="file" accept="image/png,image/jpeg,image/webp,image/avif,image/gif"><div id="photo-preview" hidden><img alt="Фотография покупки"><button type="button" class="text-button" id="remove-photo">Убрать фото</button></div><p class="form-error" id="purchase-error" role="alert"></p><button class="button primary full" id="save-purchase" type="submit">Сохранить покупку</button></form></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="dialog-heading"><h2 id="confirm-title"></h2><button class="icon-button" type="button" id="confirm-close" aria-label="Закрыть">×</button></div><p id="confirm-text"></p><div class="dialog-actions"><button class="button secondary" type="button" id="confirm-cancel">Отмена</button><button class="button primary" type="button" id="confirm-ok">Продолжить</button></div></dialog>
  <dialog id="photo-dialog" aria-label="Фотография покупки"><button class="icon-button" type="button" data-close aria-label="Закрыть фотографию">×</button><img id="full-photo" alt=""></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="notice">Для дневника нужен JavaScript. Включи его в настройках браузера.</p></noscript>
</body>
</html>
